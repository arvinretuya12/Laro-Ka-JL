name: Auto Deploy to Google Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Grab the latest code
        uses: actions/checkout@v3

      - name: Sync files to server securely
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_KEY }}
          REMOTE_HOST: ${{ secrets.GCP_HOST }}
          REMOTE_USER: ${{ secrets.GCP_USERNAME }}
          TARGET: "/var/www/html/"
          EXCLUDE: "/uploads/, /qrcodes/, /php/db_connect.php, /.git/, /.github/"